name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # The bundle is what people install, so a broken manifest should fail here
      # rather than at someone's double-click.
      - run: npx -y @anthropic-ai/mcpb@latest validate manifest.json
