<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Three ranking positions. The accent sits on the middle bar, not the
       tallest: the page one push from page one is the one worth working on,
       and that is what the toolkit is for. -->
  <rect width="64" height="64" rx="15" fill="#506eab"/>
  <rect x="11" y="40" width="13" height="13" rx="3" fill="#ffffff" opacity=".45"/>
  <rect x="26" y="29" width="13" height="24" rx="3" fill="#ffc46b"/>
  <rect x="41" y="14" width="13" height="39" rx="3" fill="#ffffff"/>
</svg>
